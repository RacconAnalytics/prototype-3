services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    networks:
      - private_internal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo:
    image: mongo:6
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE}
    networks:
      - private_internal
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: [
        "CMD-SHELL",
        "mongosh --username ${MONGO_INITDB_ROOT_USERNAME} \
        --password ${MONGO_INITDB_ROOT_PASSWORD} \
        --authenticationDatabase admin \
        --eval 'db.adminCommand(\"ping\")'"
      ]
      interval: 30s
      timeout: 5s
      retries: 3

  rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - private_internal
    healthcheck:
      test: ["CMD-SHELL", "timeout 5 bash -c 'cat < /dev/null > /dev/tcp/rabbitmq/5672'"]
      interval: 30s
      timeout: 5s
      retries: 3

  redis:
    image: redis:7
    command: redis-server --requirepass ${REDIS_PASSWORD} # Seguridad básica con contraseña
    networks:
      - private_internal
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD}",
          "ping"
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  users-service:
    build: ./users-service
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      FRONTEND_OAUTH_REDIRECT_URL: ${FRONTEND_OAUTH_REDIRECT_URL}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL}
      SMTP_PROVIDER: ${SMTP_PROVIDER}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_SECURE: ${SMTP_SECURE}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}
    networks:
      - private_services
      - private_internal
    depends_on:
      - postgres
      - redis

  nlp-service:
    build: ./nlp-service-nvidia
    environment:
      NVIDIA_NIM_API_KEY: ${NVIDIA_NIM_API_KEY}
    networks:
      - private_services
    

  google-trends-service:
    build: ./google-trends-acquisition-service
    environment:
      MONGODB_DB_NAME: ${MONGODB_DB_NAME}
      MONGO_HOST: ${MONGO_HOST}
      MONGO_PORT: ${MONGO_PORT}
      MONGO_USERNAME: ${MONGO_USERNAME}
      MONGO_PASSWORD: ${MONGO_PASSWORD}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      NLP_SERVICE_URL: ${NLP_SERVICE_URL}
      NLP_INFERENCE_ENDPOINT: ${NLP_INFERENCE_ENDPOINT}
      NLP_REQUEST_TIMEOUT: ${NLP_REQUEST_TIMEOUT}
    networks:
      - private_services
      - private_internal
    depends_on:
      - mongo
      - users-service
      - nlp-service

  youtube-service:
    build: ./youtube-acquisition-service
    environment:
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      MONGODB_URI: ${MONGODB_URI}
      REDIS_URL: ${REDIS_URL}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      NLP_SERVICE_URL: ${NLP_SERVICE_URL}
    networks:
      - private_services
      - private_internal
    depends_on:
      rabbitmq:
        condition: service_healthy
      mongo:
        condition: service_healthy
      users-service:
        condition: service_started
      nlp-service:
        condition: service_started
      redis:
        condition: service_healthy

  api-gateway:
    build: ./api-gateway
    environment:
      PORT: ${PORT}
      JWT_SECRET: ${JWT_SECRET}
      USER_SERVICE_URL: ${USER_SERVICE_URL}
      YOUTUBE_SCRAPPER_SERVICE_URL: ${YOUTUBE_SCRAPPER_SERVICE_URL}
      GOOGLE_TRENDS_SERVICE_URL: ${GOOGLE_TRENDS_SERVICE_URL}
      NLP_SERVICE_URL: ${NLP_SERVICE_URL}
      PROXY_TIMEOUT_SECONDS: ${PROXY_TIMEOUT_SECONDS}
    networks:
      - private_services
      - private_internal    # por si necesita consultar Redis directamente
    depends_on:
      - users-service
      - youtube-service
      - google-trends-service
      - nlp-service

  reverse-proxy:
    build:
      context: ./reverse-proxy
      dockerfile: DockerFile
    ports:
      - "8081:8081"
    networks:
      - public_web
      - private_services
    depends_on:
      - api-gateway
      
  reverse-proxy-web:
    build:
      context: ./reverse-proxy-web
      dockerfile: DockerFile
    ports:
      - "8443:443"
      - "8080:80"
    volumes:
      - ./reverse-proxy-web/certs:/etc/nginx/certs:ro
    healthcheck:
      test: ["CMD", "curl", "-fk", "https://localhost/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    depends_on:
      - web-page

  web-page:
    build:
      context: ./web-page
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      API_GATEWAY_INTERNAL_URL: ${API_GATEWAY_INTERNAL_URL}
    networks:
      - private_services
    depends_on:
      - api-gateway

# Redes por zona
networks:
  public_web:
    driver: bridge
    name: raccon_public_web

  public_desktop:
    driver: bridge
    name: raccon_public_desktop

  private_internal:
    driver: bridge
    name: raccon_private_internal
    internal: true        # para DBs, Redis
                          # componentes que NUNCA necesitan internet

  private_services:
    driver: bridge
    name: raccon_private_services
                          # sin internal: true
                          # para microservicios que necesitan APIs externas

volumes:
  postgres_data:
  mongo_data: